<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>JOE // AI</title> <style> *{box-sizing:border-box} body{ margin:0; min-height:100vh; background: radial-gradient(circle at 50% -20%,#123b46 0%,#071016 45%,#020608 100%); color:#d9faff; font-family:"Courier New",monospace; display:flex; justify-content:center; align-items:center; padding:18px; } .app{ width:100%; max-width:950px; height:92vh; display:flex; flex-direction:column; background:rgba(3,11,15,.97); border:1px solid #155c68; border-radius:18px; overflow:hidden; box-shadow:0 0 60px rgba(0,255,220,.08); } .header{ min-height:78px; padding:15px 20px; display:flex; align-items:center; gap:15px; background:rgba(5,20,25,.96); border-bottom:1px solid #124d58; } .logo{ width:48px; height:48px; border:1px solid #27e7d0; border-radius:12px; display:flex; justify-content:center; align-items:center; font-size:25px; background:#071b20; box-shadow:0 0 18px rgba(39,231,208,.18); } .title{ font-size:20px; font-weight:bold; letter-spacing:3px; color:#67ffe9; } .subtitle{ margin-top:5px; font-size:10px; color:#658b93; } .status{ margin-left:auto; color:#43ff91; font-size:11px; } .dot{ display:inline-block; width:7px; height:7px; background:#43ff91; border-radius:50%; box-shadow:0 0 10px #43ff91; margin-right:5px; } #chat{ flex:1; overflow-y:auto; padding:25px; scroll-behavior:smooth; } .message{ display:flex; margin-bottom:20px; } .message-box{ max-width:82%; padding:14px 17px; border-radius:12px; line-height:1.6; font-family:Arial,sans-serif; } .joe{justify-content:flex-start} .joe .message-box{ background:#09191e; border:1px solid #12454e; border-left:3px solid #22e0cb; } .user{justify-content:flex-end} .user .message-box{ background:#0b3038; border:1px solid #176b75; } .name{ font-family:"Courier New",monospace; font-size:10px; letter-spacing:2px; color:#42f5dc; margin-bottom:6px; } .user .name{color:#7bbcff} .text{ font-size:15px; white-space:normal; } .text strong{color:#66ffe9} .text code{ color:#7dffbd; background:#02090c; padding:2px 5px; border-radius:4px; } #typing{ display:none; padding:0 25px 12px; color:#4debd7; font-size:11px; } .thinking-dots{ display:inline-flex; gap:4px; margin-left:5px; } .thinking-dots span{ width:5px; height:5px; background:#4debd7; border-radius:50%; animation:thinking 1.2s infinite; } .thinking-dots span:nth-child(2){animation-delay:.2s} .thinking-dots span:nth-child(3){animation-delay:.4s} @keyframes thinking{ 0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} } .input-area{ position:relative; display:flex; gap:8px; padding:15px; background:#040c10; border-top:1px solid #12434c; } #userInput{ flex:1; min-width:0; background:#061217; border:1px solid #15505a; border-radius:10px; color:#d9faff; outline:none; padding:14px; font-family:"Courier New",monospace; font-size:14px; } #userInput:focus{ border-color:#25e6d0; box-shadow:0 0 12px rgba(37,230,208,.1); } button{ border:1px solid #20dbc7; background:#092c31; color:#56ffe9; border-radius:10px; cursor:pointer; transition:.15s; } #commandButton{ width:52px; font-size:20px; } #sendButton{ width:55px; font-size:20px; } button:hover{ background:#0d444b; box-shadow:0 0 18px rgba(32,219,199,.18); } button:disabled{ opacity:.4; cursor:not-allowed; } #commandMenu{ position:absolute; left:15px; bottom:82px; width:360px; max-height:500px; overflow-y:auto; display:none; background:#061217; border:1px solid #1b6873; border-radius:13px; box-shadow:0 15px 45px rgba(0,0,0,.65); z-index:100; } #commandMenu.show{ display:block; } .command-header{ padding:14px; color:#52f5df; font-size:11px; letter-spacing:2px; border-bottom:1px solid #123d44; background:#061217; } .command-category{ padding:9px 14px; color:#557b83; font-size:9px; letter-spacing:2px; background:rgba(255,255,255,.02); } .command{ width:100%; border:none; background:transparent; color:#cceff2; text-align:left; padding:11px 14px; font-family:"Courier New",monospace; font-size:12px; border-bottom:1px solid rgba(255,255,255,.03); } .command:hover{ background:#0c3037; color:#65ffe8; } .command-name{ color:#62ffe9; font-weight:bold; } .command-description{ display:block; margin-top:3px; color:#6c8e95; font-size:10px; } @media(max-width:600px){ body{padding:0} .app{ height:100vh; border-radius:0; } #chat{padding:15px} .message-box{max-width:92%} .status{display:none} #commandMenu{ left:10px; right:10px; width:auto; bottom:82px; } } </style> </head> <body> <div class="app"> <div class="header"> <div class="logo">🤖</div> <div> <div class="title">JOE // AI</div> <div class="subtitle">ADVANCED AI INTELLIGENCE SYSTEM</div> </div> <div class="status"> <span class="dot"></span> ONLINE </div> </div> <div id="chat"></div> <div id="typing"> JOE IS THINKING <span class="thinking-dots"> <span></span> <span></span> <span></span> </span> </div> <div class="input-area"> <div id="commandMenu"> <div class="command-header"> JOE // COMMAND CENTRE </div> <div class="command-category">SYSTEM</div> <button class="command" data-command="/help"> <span class="command-name">/help</span> <span class="command-description">Show commands</span> </button> <button class="command" data-command="/about"> <span class="command-name">/about</span> <span class="command-description">About Joe</span> </button> <button class="command" data-command="/status"> <span class="command-name">/status</span> <span class="command-description">System status</span> </button> <button class="command" data-command="/clear"> <span class="command-name">/clear</span> <span class="command-description">Clear chat</span> </button> <div class="command-category">AI</div> <button class="command" data-command="Explain artificial intelligence"> <span class="command-name">AI</span> <span class="command-description">Ask Joe about AI</span> </button> <button class="command" data-command="What is Python?"> <span class="command-name">Python</span> <span class="command-description">Ask about Python</span> </button> <button class="command" data-command="What is HTML?"> <span class="command-name">HTML</span> <span class="command-description">Ask about HTML</span> </button> <div class="command-category">TOOLS</div> <button class="command" data-command="calculate 25 * 8"> <span class="command-name">calculate</span> <span class="command-description">Calculate something</span> </button> <button class="command" data-command="roll dice"> <span class="command-name">roll dice</span> <span class="command-description">Roll a dice</span> </button> <button class="command" data-command="flip coin"> <span class="command-name">flip coin</span> <span class="command-description">Flip a coin</span> </button> <button class="command" data-command="random number 1 100"> <span class="command-name">random number</span> <span class="command-description">Generate a number</span> </button> <button class="command" data-command="random fact"> <span class="command-name">random fact</span> <span class="command-description">Get a fact</span> </button> <div class="command-category">CONVERSATION</div> <button class="command" data-command="hello"> <span class="command-name">hello</span> <span class="command-description">Say hello</span> </button> <button class="command" data-command="what can you do"> <span class="command-name">capabilities</span> <span class="command-description">Ask what Joe can do</span> </button> <button class="command" data-command="who are you"> <span class="command-name">identity</span> <span class="command-description">Ask about Joe</span> </button> </div>

</div> </div> <script> const API_URL = "https://joe-ai-backend-1wch.onrender.com/chat"; const input = document.getElementById("userInput"); const chat = document.getElementById("chat"); const sendButton = document.getElementById("sendButton"); const commandButton = document.getElementById("commandButton"); const commandMenu = document.getElementById("commandMenu"); const typing = document.getElementById("typing"); /* COMMAND MENU */ commandButton.addEventListener("click",function(e){ e.stopPropagation(); commandMenu.classList.toggle("show"); }); document.querySelectorAll(".command").forEach(function(button){ button.addEventListener("click",function(){ input.value=this.dataset.command; commandMenu.classList.remove("show"); input.focus(); }); }); document.addEventListener("click",function(e){ if( !commandMenu.contains(e.target) && e.target!==commandButton ){ commandMenu.classList.remove("show"); } }); /* MESSAGE */ function addMessage(sender,text,type){ const message=document.createElement("div"); message.className="message "+type; const box=document.createElement("div"); box.className="message-box"; const name=document.createElement("div"); name.className="name"; name.textContent=sender; const content=document.createElement("div"); content.className="text"; content.innerHTML=text; box.appendChild(name); box.appendChild(content); message.appendChild(box); chat.appendChild(message); chat.scrollTop=chat.scrollHeight; } /* SIMPLE LOCAL COMMANDS */ function localCommand(text){ const t=text.toLowerCase().trim(); if(t==="/clear"){ chat.innerHTML=""; return "🧹 Chat cleared."; } if(t==="/about"){ return ` <strong>JOE // AI</strong> <br><br> AI-powered technical assistant. <br><br> Backend: ONLINE<br> AI engine: CONNECTED `; } if(t==="/status"){ return ` <strong>JOE SYSTEM STATUS</strong> <br><br> Interface ..... 🟢 ONLINE <br> Backend ....... 🟢 CONNECTED <br> AI ............ 🟢 READY `; } if(t==="/help"){ return ` <strong>JOE COMMAND CENTRE</strong> <br><br> Ask me anything normally. <br><br> You can also use: <br><br> <code>/about</code> <br> <code>/status</code> <br> <code>/clear</code> `; } if(t==="hello"||t==="hi"||t==="hey"){ return "Hello! 🤖 What can I help you with?"; } if(t==="who are you"){ return "I'm <strong>Joe</strong>, your AI assistant. 🤖"; } if(t==="what can you do"){ return "I can answer questions, explain things, help with coding, mathematics, writing, science, history and much more."; } if(t==="roll dice"){ return "🎲 You rolled: <strong>"+ (Math.floor(Math.random()*6)+1)+ "</strong>"; } if(t==="flip coin"){ return "🪙 <strong>"+ (Math.random()<0.5?"Heads":"Tails")+ "</strong>"; } if(t.startsWith("random number")){ const nums=t.match(/-?\d+/g); if(nums&&nums.length>=2){ const min=Number(nums[0]); const max=Number(nums[1]); if(min<=max){ return "🎲 Random number: <strong>"+ (Math.floor(Math.random()*(max-min+1))+min)+ "</strong>"; } } } return null; } /* AI REQUEST */ async function askJoe(text){ const local=localCommand(text); if(local!==null){ if(text.toLowerCase().trim()==="/clear"){ return local; } return local; } const response=await fetch(API_URL,{ method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ message:text }) }); if(!response.ok){ throw new Error( "Backend returned HTTP "+response.status ); } const data=await response.json(); return ( data.reply || data.response || data.message || "Joe received the message but the backend returned no answer." ); } /* SEND */ async function sendMessage(){ const text=input.value.trim(); if(!text)return; addMessage("YOU",text,"user"); input.value=""; sendButton.disabled=true; input.disabled=true; typing.style.display="block"; chat.scrollTop=chat.scrollHeight; try{ const answer=await askJoe(text); typing.style.display="none"; addMessage( "JOE", answer, "joe" ); }catch(error){ console.error(error); typing.style.display="none"; addMessage( "JOE", ` ⚠️ <strong>Connection error.</strong> <br><br> I couldn't reach my AI backend. <br><br> Check that the Render service is running and that the <code>/chat</code> endpoint is configured correctly. `, "joe" ); } sendButton.disabled=false; input.disabled=false; input.focus(); } /* EVENTS */ sendButton.addEventListener( "click", sendMessage ); input.addEventListener( "keydown", function(event){ if(event.key==="Enter"){ event.preventDefault(); sendMessage(); } }); /* STARTUP */ addMessage( "JOE", ` <strong>JOE // AI INITIALIZED</strong> <br><br> AI systems online. 🟢 <br><br> Ask me anything. <br><br> Try: <strong>What is the capital of France?</strong> `, "joe" ); </script> </body> </html>
