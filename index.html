<head>

<meta charset="UTF-8">

<title>JOE // AI</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg1: #123b46;
    --bg2: #071016;
    --bg3: #020608;
    --panel: rgba(3, 11, 15, .97);
    --header: rgba(5,20,25,.96);
    --input: #040c10;

    --border: #155c68;
    --border2: #124d58;

    --primary: #27e7d0;
    --primary2: #67ffe9;
    --text: #d9faff;
    --muted: #658b93;

    --user-bg: #0b3038;
    --joe-bg: #09191e;

    --online: #43ff91;
}


/* =====================================================
   THEMES
===================================================== */

body.theme-blue {
    --bg1: #123b46;
    --bg2: #071016;
    --bg3: #020608;
    --primary: #27e7d0;
    --primary2: #67ffe9;
    --border: #155c68;
    --border2: #124d58;
    --user-bg: #0b3038;
    --joe-bg: #09191e;
}

body.theme-purple {
    --bg1: #32184d;
    --bg2: #11081b;
    --bg3: #050208;
    --primary: #c66cff;
    --primary2: #e3a6ff;
    --border: #713d91;
    --border2: #542c6c;
    --user-bg: #35134b;
    --joe-bg: #1b0d27;
}

body.theme-red {
    --bg1: #4a1616;
    --bg2: #170707;
    --bg3: #050101;
    --primary: #ff5c6c;
    --primary2: #ff9ba5;
    --border: #87353f;
    --border2: #63252d;
    --user-bg: #42151b;
    --joe-bg: #220c10;
}

body.theme-gold {
    --bg1: #4a3b12;
    --bg2: #181305;
    --bg3: #070601;
    --primary: #ffd34e;
    --primary2: #ffe78b;
    --border: #806b25;
    --border2: #66551e;
    --user-bg: #3d3211;
    --joe-bg: #211b09;
}

body.theme-matrix {
    --bg1: #063d16;
    --bg2: #031508;
    --bg3: #010502;
    --primary: #20ff68;
    --primary2: #78ff9e;
    --border: #176d30;
    --border2: #0d4c20;
    --user-bg: #07351a;
    --joe-bg: #041b0c;
}


/* =====================================================
   GLOBAL
===================================================== */

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -20%,
            var(--bg1) 0%,
            var(--bg2) 45%,
            var(--bg3) 100%
        );

    color: var(--text);

    font-family:
        "Courier New",
        monospace;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 18px;

    transition:
        background .3s ease;
}


.app {

    width: 100%;

    max-width: 950px;

    height: 92vh;

    display: flex;

    flex-direction: column;

    background: var(--panel);

    border:
        1px solid var(--border);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 0 60px
        color-mix(
            in srgb,
            var(--primary) 10%,
            transparent
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    min-height: 78px;

    padding: 15px 20px;

    display: flex;

    align-items: center;

    gap: 15px;

    background: var(--header);

    border-bottom:
        1px solid var(--border2);
}


.logo {

    width: 48px;

    height: 48px;

    border:
        1px solid var(--primary);

    border-radius: 12px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 25px;

    background: color-mix(
        in srgb,
        var(--primary) 8%,
        #071b20
    );

    box-shadow:
        0 0 18px
        color-mix(
            in srgb,
            var(--primary) 18%,
            transparent
        );
}


.title {

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 3px;

    color: var(--primary2);
}


.subtitle {

    margin-top: 5px;

    font-size: 10px;

    color: var(--muted);
}


.status {

    margin-left: auto;

    color: var(--online);

    font-size: 11px;
}


.dot {

    display: inline-block;

    width: 7px;

    height: 7px;

    background: var(--online);

    border-radius: 50%;

    box-shadow:
        0 0 10px var(--online);

    margin-right: 5px;
}


/* =====================================================
   CHAT
===================================================== */

#chat {

    flex: 1;

    overflow-y: auto;

    padding: 25px;

    scroll-behavior: smooth;
}


#chat::-webkit-scrollbar {

    width: 6px;
}


#chat::-webkit-scrollbar-thumb {

    background: var(--border2);

    border-radius: 10px;
}


.message {

    display: flex;

    margin-bottom: 20px;

    animation:
        messageIn .25s ease;
}


@keyframes messageIn {

    from {

        opacity: 0;

        transform:
            translateY(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.message-box {

    max-width: 82%;

    padding: 14px 17px;

    border-radius: 12px;

    line-height: 1.6;

    font-family: Arial, sans-serif;
}


.joe {

    justify-content:
        flex-start;
}


.joe .message-box {

    background: var(--joe-bg);

    border:
        1px solid var(--border2);

    border-left:
        3px solid var(--primary);
}


.user {

    justify-content:
        flex-end;
}


.user .message-box {

    background: var(--user-bg);

    border:
        1px solid var(--border);
}


.name {

    font-family:
        "Courier New",
        monospace;

    font-size: 10px;

    letter-spacing: 2px;

    color: var(--primary);

    margin-bottom: 6px;
}


.user .name {

    color: #7bbcff;
}


.text {

    font-size: 15px;

    white-space: normal;

    overflow-wrap: anywhere;
}


.text strong {

    color: var(--primary2);
}


.text code {

    color: #7dffbd;

    background: #02090c;

    padding: 2px 5px;

    border-radius: 4px;
}


/* =====================================================
   THINKING
===================================================== */

#typing {

    display: none;

    padding:
        0 25px 12px;

    color: var(--primary);

    font-size: 11px;
}


.thinking-dots {

    display: inline-flex;

    gap: 4px;

    margin-left: 5px;
}


.thinking-dots span {

    width: 5px;

    height: 5px;

    background: var(--primary);

    border-radius: 50%;

    animation:
        thinking 1.2s infinite;
}


.thinking-dots span:nth-child(2) {

    animation-delay: .2s;
}


.thinking-dots span:nth-child(3) {

    animation-delay: .4s;
}


@keyframes thinking {

    0%, 60%, 100% {

        opacity: .25;

        transform:
            translateY(0);
    }

    30% {

        opacity: 1;

        transform:
            translateY(-3px);
    }
}


/* =====================================================
   INPUT
===================================================== */

.input-area {

    position: relative;

    display: flex;

    gap: 8px;

    padding: 15px;

    background: var(--input);

    border-top:
        1px solid var(--border2);
}


#userInput {

    flex: 1;

    min-width: 0;

    background: #061217;

    border:
        1px solid var(--border2);

    border-radius: 10px;

    color: var(--text);

    outline: none;

    padding: 14px;

    font-family:
        "Courier New",
        monospace;

    font-size: 14px;
}


#userInput:focus {

    border-color: var(--primary);

    box-shadow:
        0 0 12px
        color-mix(
            in srgb,
            var(--primary) 10%,
            transparent
        );
}


/* =====================================================
   BUTTONS
===================================================== */

#commandButton,
#sendButton {

    border:
        1px solid var(--primary);

    background: color-mix(
        in srgb,
        var(--primary) 10%,
        #092c31
    );

    color: var(--primary2);

    border-radius: 10px;

    cursor: pointer;

    transition: .15s;
}


#commandButton {

    width: 52px;

    font-size: 20px;
}


#sendButton {

    width: 55px;

    font-size: 20px;
}


#commandButton:hover,
#sendButton:hover {

    background:
        color-mix(
            in srgb,
            var(--primary) 20%,
            #0d444b
        );

    box-shadow:
        0 0 18px
        color-mix(
            in srgb,
            var(--primary) 18%,
            transparent
        );
}


button:disabled {

    opacity: .4;

    cursor:
        not-allowed;
}


/* =====================================================
   COMMAND MENU
===================================================== */

#commandMenu {

    position: absolute;

    left: 15px;

    bottom: 82px;

    width: 360px;

    max-height: 500px;

    overflow-y: auto;

    display: none;

    background: #061217;

    border:
        1px solid var(--border);

    border-radius: 13px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.65);

    z-index: 100;
}


#commandMenu.show {

    display: block;

    animation:
        menuIn .18s ease;
}


@keyframes menuIn {

    from {

        opacity: 0;

        transform:
            translateY(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.command-header {

    padding: 14px;

    color: var(--primary);

    font-size: 11px;

    letter-spacing: 2px;

    border-bottom:
        1px solid var(--border2);

    position: sticky;

    top: 0;

    background: #061217;
}


.command-category {

    padding:
        9px 14px;

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 2px;

    background:
        rgba(255,255,255,.02);
}


.command {

    width: 100%;

    border: none;

    background: transparent;

    color: #cceff2;

    text-align: left;

    padding:
        11px 14px;

    cursor: pointer;

    font-family:
        "Courier New",
        monospace;

    font-size: 12px;

    border-bottom:
        1px solid rgba(255,255,255,.03);
}


.command:hover {

    background: #0c3037;

    color: var(--primary2);
}


.command-name {

    color: var(--primary);

    font-weight: bold;
}


.command-description {

    display: block;

    margin-top: 3px;

    color: #6c8e95;

    font-size: 10px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 0;
    }


    .app {

        height: 100vh;

        border-radius: 0;
    }


    #chat {

        padding: 15px;
    }


    .message-box {

        max-width: 92%;
    }


    .status {

        display: none;
    }


    #commandMenu {

        left: 10px;

        right: 10px;

        width: auto;

        bottom: 82px;
    }

}

</style>

</head>

/* =====================================================
   CALCULATOR
===================================================== */

function calculate(expression) {

    expression =
        expression
            .replace(/x/gi, "*")
            .replace(/÷/g, "/")
            .replace(
                /[^0-9+\-*/().%\s]/g,
                ""
            );

    if (!expression.trim()) {

        return `
            Enter a calculation.

            <br><br>

            Example:
            <code>25 * 8</code>
        `;

    }

    try {

        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

        if (
            !Number.isFinite(result)
        ) {

            return "That calculation produced an invalid result.";

        }

        return `
            🧮 Result:
            <strong>${result}</strong>
        `;

    }

    catch {

        return `
            I couldn't calculate that.
        `;

    }

}


/* =====================================================
   RANDOM NUMBER
===================================================== */

function randomNumber(text) {

    const numbers =
        text.match(/-?\d+/g);

    if (
        !numbers ||
        numbers.length < 2
    ) {

        return `
            Try:
            <code>random number 1 100</code>
        `;

    }

    const min =
        Number(numbers[0]);

    const max =
        Number(numbers[1]);

    if (min > max) {

        return "The minimum must be smaller than the maximum.";

    }

    const result =
        Math.floor(
            Math.random() *
            (max - min + 1)
        ) + min;

    return `
        🎲 Random number:
        <strong>${result}</strong>
    `;

}


/* =====================================================
   CONVERSION
===================================================== */

function convert(text) {

    const match =
        text.match(
            /(-?\d+(?:\.\d+)?)\s*(km|kilometers?|miles?|mi|kg|kilograms?|lb|pounds?|c|celsius|f|fahrenheit)\s*(?:to|in)\s*(km|kilometers?|miles?|mi|kg|kilograms?|lb|pounds?|c|celsius|f|fahrenheit)/i
        );

    if (!match) {

        return `
            Try:
            <code>convert 10 km to miles</code>
        `;

    }

    const value =
        parseFloat(match[1]);

    const from =
        match[2].toLowerCase();

    const to =
        match[3].toLowerCase();

    let result;

    if (
        (
            from === "km" ||
            from.startsWith("kilometer")
        ) &&
        (
            to === "mi" ||
            to.startsWith("mile")
        )
    ) {

        result =
            value * 0.621371;

    }

    else if (
        (
            from === "mi" ||
            from.startsWith("mile")
        ) &&
        (
            to === "km" ||
            to.startsWith("kilometer")
        )
    ) {

        result =
            value * 1.609344;

    }

    else if (
        (
            from === "kg" ||
            from.startsWith("kilogram")
        ) &&
        (
            to === "lb" ||
            to.startsWith("pound")
        )
    ) {

        result =
            value * 2.2046226218;

    }

    else if (
        (
            from === "lb" ||
            from.startsWith("pound")
        ) &&
        (
            to === "kg" ||
            to.startsWith("kilogram")
        )
    ) {

        result =
            value * 0.45359237;

    }

    else if (
        (
            from === "c" ||
            from === "celsius"
        ) &&
        (
            to === "f" ||
            to === "fahrenheit"
        )
    ) {

        result =
            (value * 9 / 5) + 32;

    }

    else if (
        (
            from === "f" ||
            from === "fahrenheit"
        ) &&
        (
            to === "c" ||
            to === "celsius"
        )
    ) {

        result =
            (value - 32) * 5 / 9;

    }

    else {

        return "I don't support that conversion yet.";

    }

    return `
        🔄 ${value} ${from}
        ≈ <strong>${result.toFixed(3)}</strong>
        ${to}
    `;

}

function addMessage(

/* =====================================================
   TYPE RESPONSE
===================================================== */

function typeText(
    element,
    text
) {

    const parts =
        text.split(
            /(<[^>]+>)/g
        );

    let partIndex = 0;

    let characterIndex = 0;

    let output = "";

    const cursor =
        document.createElement(
            "span"
        );

    cursor.style.display =
        "inline-block";

    cursor.style.width =
        "7px";

    cursor.style.height =
        "17px";

    cursor.style.background =
        "var(--primary)";

    cursor.style.marginLeft =
        "4px";

    cursor.style.verticalAlign =
        "-3px";

    cursor.style.animation =
        "cursorBlink .8s infinite";

    element.appendChild(
        cursor
    );

    function next() {

        if (
            partIndex >=
            parts.length
        ) {

            cursor.remove();

            element.innerHTML =
                output;

            chat.scrollTop =
                chat.scrollHeight;

            return;

        }

        const part =
            parts[partIndex];

        if (
            part.startsWith("<")
        ) {

            output += part;

            partIndex++;

            next();

            return;

        }

        if (
            characterIndex <
            part.length
        ) {

            output +=
                part.charAt(
                    characterIndex
                );

            characterIndex++;

            element.innerHTML =
                output;

            element.appendChild(
                cursor
            );

            chat.scrollTop =
                chat.scrollHeight;

            const delay =
                part[
                    characterIndex - 1
                ] === " "
                    ? 4
                    : 14;

            setTimeout(
                next,
                delay
            );

            return;

        }

        partIndex++;

        characterIndex = 0;

        next();

    }

    next();

}

/* =====================================================
   GEMINI REQUEST
===================================================== */

async function askGemini(message) {

    const response =
        await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

    if (!response.ok) {

        throw new Error(
            "Backend returned HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    if (data.error) {

        throw new Error(
            data.error
        );

    }

    if (!data.reply) {

        throw new Error(
            "No reply received."
        );

    }

    return data.reply;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {

        return;

    }


    addMessage(
        "YOU",
        escapeHTML(text),
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    input.disabled =
        true;


    typing.style.display =
        "block";


    chat.scrollTop =
        chat.scrollHeight;


    const local =
        localReply(text);


    if (local !== null) {

        setTimeout(
            function() {

                typing.style.display =
                    "none";

                addMessage(
                    "JOE",
                    local,
                    "joe",
                    true
                );

                sendButton.disabled =
                    false;

                input.disabled =
                    false;

                input.focus();

            },
            350
        );

        return;

    }


    try {

        const reply =
            await askGemini(
                text
            );

        typing.style.display =
            "none";

        addMessage(
            "JOE",
            formatAIResponse(
                reply
            ),
            "joe",
            true
        );

    }

    catch (error) {

        typing.style.display =
            "none";

        addMessage(
            "JOE",
            `
                ⚠️ <strong>AI CONNECTION ERROR</strong>

                <br><br>

                I couldn't reach the Gemini backend.

                <br><br>

                Check that the Render service is running and that your Gemini API key is configured.

                <br><br>

                <code>${escapeHTML(error.message)}</code>
            `,
            "joe",
            true
        );

    }


    sendButton.disabled =
        false;

    input.disabled =
        false;

    input.focus();

}


/* =====================================================
   RESPONSE FORMATTING
===================================================== */

function formatAIResponse(text) {

    let result =
        escapeHTML(text);

    result =
        result.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    result =
        result.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

    result =
        result.replace(
            /\n/g,
            "<br>"
        );

    return result;

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
