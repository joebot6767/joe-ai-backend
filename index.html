<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title>JOE // AI</title> <style> *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#123b46,#071016 45%,#020608);color:#d9faff;font-family:"Courier New",monospace;display:flex;justify-content:center;align-items:center;padding:18px} .app{width:100%;max-width:950px;height:92vh;display:flex;flex-direction:column;background:rgba(3,11,15,.97);border:1px solid #155c68;border-radius:18px;overflow:hidden;box-shadow:0 0 60px rgba(0,255,220,.08)} .header{min-height:78px;padding:15px 20px;display:flex;align-items:center;gap:15px;background:rgba(5,20,25,.96);border-bottom:1px solid #124d58} .logo{width:48px;height:48px;border:1px solid #27e7d0;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:25px;background:#071b20} .title{font-size:20px;font-weight:bold;letter-spacing:3px;color:#67ffe9} .subtitle{margin-top:5px;font-size:10px;color:#658b93} .status{margin-left:auto;color:#43ff91;font-size:11px} .dot{display:inline-block;width:7px;height:7px;background:#43ff91;border-radius:50%;box-shadow:0 0 10px #43ff91;margin-right:5px} #chat{flex:1;overflow-y:auto;padding:25px} .message{display:flex;margin-bottom:20px} .message-box{max-width:82%;padding:14px 17px;border-radius:12px;line-height:1.6;font-family:Arial,sans-serif} .joe{justify-content:flex-start} .joe .message-box{background:#09191e;border:1px solid #12454e;border-left:3px solid #22e0cb} .user{justify-content:flex-end} .user .message-box{background:#0b3038;border:1px solid #176b75} .name{font-family:"Courier New",monospace;font-size:10px;letter-spacing:2px;color:#42f5dc;margin-bottom:6px} .user .name{color:#7bbcff} .text{font-size:15px;white-space:pre-wrap} .text strong{color:#66ffe9} #typing{display:none;padding:0 25px 12px;color:#4debd7;font-size:11px} .thinking-dots{display:inline-flex;gap:4px;margin-left:5px} .thinking-dots span{width:5px;height:5px;background:#4debd7;border-radius:50%;animation:thinking 1.2s infinite} .thinking-dots span:nth-child(2){animation-delay:.2s} .thinking-dots span:nth-child(3){animation-delay:.4s} @keyframes thinking{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}} .input-area{position:relative;display:flex;gap:8px;padding:15px;background:#040c10;border-top:1px solid #12434c} #userInput{flex:1;min-width:0;background:#061217;border:1px solid #15505a;border-radius:10px;color:#d9faff;outline:none;padding:14px;font-family:"Courier New",monospace;font-size:14px} #userInput:focus{border-color:#25e6d0} button{border:1px solid #20dbc7;background:#092c31;color:#56ffe9;border-radius:10px;cursor:pointer} #commandButton{width:52px;font-size:20px} #sendButton{width:55px;font-size:20px} button:hover{background:#0d444b} button:disabled{opacity:.4;cursor:not-allowed} #commandMenu{position:absolute;left:15px;bottom:82px;width:360px;max-height:500px;overflow-y:auto;display:none;background:#061217;border:1px solid #1b6873;border-radius:13px;box-shadow:0 15px 45px #000;z-index:100} #commandMenu.show{display:block} .command-header{padding:14px;color:#52f5df;font-size:11px;letter-spacing:2px;border-bottom:1px solid #123d44} .command-category{padding:9px 14px;color:#557b83;font-size:9px;letter-spacing:2px;background:rgba(255,255,255,.02)} .command{width:100%;border:none;background:transparent;color:#cceff2;text-align:left;padding:11px 14px;font-family:"Courier New",monospace;font-size:12px} .command:hover{background:#0c3037;color:#65ffe8} .command-name{color:#62ffe9;font-weight:bold} .command-description{display:block;margin-top:3px;color:#6c8e95;font-size:10px} @media(max-width:600px){body{padding:0}.app{height:100vh;border-radius:0}#chat{padding:15px}.message-box{max-width:92%}.status{display:none}#commandMenu{left:10px;right:10px;width:auto}} </style> </head> <body> <div class="app"> <div class="header"> <div class="logo">🤖</div> <div> <div class="title">JOE // AI</div> <div class="subtitle">ADVANCED AI INTELLIGENCE SYSTEM</div> </div> <div class="status"><span class="dot"></span>ONLINE</div> </div> <div id="chat"></div> <div id="typing"> JOE IS THINKING <span class="thinking-dots"><span></span><span></span><span></span></span> </div> <div class="input-area"> <div id="commandMenu"> <div class="command-header">JOE // COMMAND CENTRE</div> <div class="command-category">SYSTEM</div> <button class="command" data-command="/help"> <span class="command-name">/help</span> <span class="command-description">Show commands</span> </button> <button class="command" data-command="/about"> <span class="command-name">/about</span> <span class="command-description">About Joe</span> </button> <button class="command" data-command="/status"> <span class="command-name">/status</span> <span class="command-description">System status</span> </button> <button class="command" data-command="/clear"> <span class="command-name">/clear</span> <span class="command-description">Clear chat</span> </button> <div class="command-category">TOOLS</div> <button class="command" data-command="roll dice"> <span class="command-name">roll dice</span> <span class="command-description">Roll a dice</span> </button> <button class="command" data-command="flip coin"> <span class="command-name">flip coin</span> <span class="command-description">Flip a coin</span> </button> <button class="command" data-command="random number 1 100"> <span class="command-name">random number</span> <span class="command-description">Generate a number</span> </button> <div class="command-category">AI</div> <button class="command" data-command="What is artificial intelligence?"> <span class="command-name">AI</span> <span class="command-description">Ask Joe about AI</span> </button> <button class="command" data-command="Explain Python"> <span class="command-name">Python</span> <span class="command-description">Ask Joe about Python</span> </button> <button class="command" data-command="What is HTML?"> <span class="command-name">HTML</span> <span class="command-description">Ask Joe about HTML</span> </button> </div>

</div> </div> <script> const API_URL="https://joe-ai-backend-1wch.onrender.com/chat"; const input=document.getElementById("userInput"); const chat=document.getElementById("chat"); const sendButton=document.getElementById("sendButton"); const commandButton=document.getElementById("commandButton"); const commandMenu=document.getElementById("commandMenu"); const typing=document.getElementById("typing"); commandButton.addEventListener("click",function(event){ event.stopPropagation(); commandMenu.classList.toggle("show"); }); document.querySelectorAll(".command").forEach(function(button){ button.addEventListener("click",function(){ input.value=this.dataset.command; commandMenu.classList.remove("show"); input.focus(); }); }); document.addEventListener("click",function(event){ if(!commandMenu.contains(event.target)&&event.target!==commandButton){ commandMenu.classList.remove("show"); } }); function addMessage(sender,text,type){ const message=document.createElement("div"); message.className="message "+type; const box=document.createElement("div"); box.className="message-box"; const name=document.createElement("div"); name.className="name"; name.textContent=sender; const content=document.createElement("div"); content.className="text"; content.textContent=text; box.appendChild(name); box.appendChild(content); message.appendChild(box); chat.appendChild(message); chat.scrollTop=chat.scrollHeight; } function localCommand(text){ const command=text.toLowerCase().trim(); if(command==="/clear"){ chat.innerHTML=""; return "🧹 Conversation cleared."; } if(command==="/help"){ return "JOE is connected to the AI backend. Ask me anything, or use the / command menu."; } if(command==="/about"){ return "JOE // AI\n\nAI-powered assistant connected to a Google Gemini backend."; } if(command==="/status"){ return "Interface: ONLINE\nBackend: CONNECTED\nAI: READY"; } if(command==="hello"||command==="hi"||command==="hey"){ return "Hello! 🤖 What can I help you with?"; } if(command==="roll dice"){ return "🎲 You rolled: "+(Math.floor(Math.random()*6)+1); } if(command==="flip coin"){ return "🪙 "+(Math.random()<0.5?"Heads":"Tails"); } if(command.startsWith("random number")){ const numbers=command.match(/-?\d+/g); if(numbers&&numbers.length>=2){ const min=Number(numbers[0]); const max=Number(numbers[1]); if(min<=max){ return "🎲 Random number: "+(Math.floor(Math.random()*(max-min+1))+min); } } } return null; } async function askAI(text){ const local=localCommand(text); if(local!==null){ return local; } const response=await fetch(API_URL,{ method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ message:text }) }); const data=await response.json(); if(data.error){ throw new Error(data.details||data.error); } if(!data.reply){ throw new Error("The backend did not return a reply."); } return data.reply; } async function sendMessage(){ const text=input.value.trim(); if(!text)return; addMessage("YOU",text,"user"); input.value=""; input.disabled=true; sendButton.disabled=true; typing.style.display="block"; try{ const answer=await askAI(text); typing.style.display="none"; addMessage("JOE",answer,"joe"); }catch(error){ console.error(error); typing.style.display="none"; addMessage( "JOE", "⚠️ I couldn't connect to the AI backend.\n\n"+error.message, "joe" ); } input.disabled=false; sendButton.disabled=false; input.focus(); } sendButton.addEventListener("click",sendMessage); input.addEventListener("keydown",function(event){ if(event.key==="Enter"){ event.preventDefault(); sendMessage(); } }); addMessage( "JOE", "JOE // AI INITIALIZED\n\n🟢 Backend connection ready.\n\nAsk me anything!", "joe" ); </script> </body> </html>
